preview_history:
  name: Preview historical readings
  description: Administrator-only. Inspect readings grouped by lot, fluid and physical meter; sparse history is never made up. Does not change recorder.
  fields:
    entry_id:
      description: Optional when only one account is installed.
      selector:
        text: {}
    start_date:
      description: Beginning of requested period (YYYY-MM-DD).
      example: "2021-12-22"
      selector:
        text: {}
    end_date:
      description: End of requested period (YYYY-MM-DD); defaults to today.
      selector:
        text: {}
import_history:
  name: Import historical statistics (experimental)
  description: Administrator-only, experimental. Backup and confirm first. Near-daily measured increments and optional explicit accounting allocations use separate per-meter statistics; no automatic backfill or legacy migration.
  fields:
    entry_id:
      selector:
        text: {}
    start_date:
      example: "2021-12-22"
      selector:
        text: {}
    end_date:
      selector:
        text: {}
    include_cold_water:
      description: Import cold water independently (uncheck if its indexes are anomalous).
      default: true
      selector:
        boolean: {}
    include_hot_water:
      description: Import hot water independently.
      default: true
      selector:
        boolean: {}
    include_heating:
      description: Heating is excluded by default until its kWh unit has been verified.
      default: false
      selector:
        boolean: {}
    confirm_heating_kwh:
      selector:
        boolean: {}
    allow_gaps:
      description: Allow a PARTIAL import of daily-cadence intervals only. Sparse historical differences remain excluded, never interpolated.
      default: false
      selector:
        boolean: {}
    skip_anomalous_meters:
      description: Skip meters with fatal unresolved identity/date conflicts; isolated source conflicts and declines can preserve other daily-safe intervals.
      default: false
      selector:
        boolean: {}
    include_accounting:
      description: Opt in to separately import user-approved accounting allocations of sparse consumption (not daily measurements).
      default: false
      selector:
        boolean: {}
    confirm_accounting:
      description: Additional explicit confirmation to queue historical accounting allocations.
      default: false
      selector:
        boolean: {}
    confirm_revision:
      description: Allow creating a NEW versioned statistics series for backfills/corrections. Old series remain and must be deselected manually in Energy.
      default: false
      selector:
        boolean: {}
    confirm:
      description: Explicit confirmation of backup, preview review and recorder write.
      required: true
      selector:
        boolean: {}

audit_history:
  name: Audit historical Recorder statistics
  description: Administrator-only. Compare the planned long-term hourly rows to persisted Recorder rows without writing any data.
  fields:
    entry_id:
      description: Trybatec configuration entry ID (required for multiple accounts).
      selector:
        text:

plan_history:
  name: Preview planned historical Recorder writes
  description: Administrator-only. Exact dry-run of selected daily and approved accounting statistics; never changes database or storage.
  fields:
    entry_id:
      description: Trybatec config entry ID if more than one account exists.
      selector:
        text:
    start_date:
      description: Starting date (YYYY-MM-DD).
      selector:
        date:
    end_date:
      description: Ending date (YYYY-MM-DD).
      selector:
        date:
    include_heating:
      description: Include CET only when each physical meter source unit has been independently confirmed.
      selector:
        boolean:
    include_accounting:
      description: Include the previously approved accounting allocations in this read-only plan.
      selector:
        boolean:
    allow_gaps:
      description: Show partial daily usage when sparse intervals exist.
      selector:
        boolean:
    confirm_revision:
      description: Preview a new versioned series for any changed existing statistics.
      selector:
        boolean:

preview_history:
  name: Preview historical readings
  description: Administrator-only. Inspect readings grouped by lot, fluid and physical meter; sparse history is never made up. Does not change recorder.
  fields:
    entry_id:
      description: Optional when only one account is installed.
      selector:
        text: {}
    start_date:
      description: Beginning of requested period (YYYY-MM-DD).
      example: "2021-12-22"
      selector:
        text: {}
    end_date:
      description: End of requested period (YYYY-MM-DD); defaults to today.
      selector:
        text: {}
import_history:
  name: Import historical statistics (experimental)
  description: Administrator-only, experimental. Backup and confirm first. Near-daily measured increments and optional explicit accounting allocations use separate per-meter statistics; no automatic backfill or legacy migration.
  fields:
    entry_id:
      selector:
        text: {}
    start_date:
      example: "2021-12-22"
      selector:
        text: {}
    end_date:
      selector:
        text: {}
    include_cold_water:
      description: Import cold water independently (uncheck if its indexes are anomalous).
      default: true
      selector:
        boolean: {}
    include_hot_water:
      description: Import hot water independently.
      default: true
      selector:
        boolean: {}
    include_heating:
      description: Heating is excluded by default until its kWh unit has been verified.
      default: false
      selector:
        boolean: {}
    confirm_heating_kwh:
      selector:
        boolean: {}
    allow_gaps:
      description: Allow a PARTIAL import of daily-cadence intervals only. Sparse historical differences remain excluded, never interpolated.
      default: false
      selector:
        boolean: {}
    skip_anomalous_meters:
      description: Skip meters with fatal unresolved identity/date conflicts; isolated source conflicts and declines can preserve other daily-safe intervals.
      default: false
      selector:
        boolean: {}
    include_accounting:
      description: Opt in to separately import user-approved accounting allocations of sparse consumption (not daily measurements).
      default: false
      selector:
        boolean: {}
    confirm_accounting:
      description: Additional explicit confirmation to queue historical accounting allocations.
      default: false
      selector:
        boolean: {}
    confirm_revision:
      description: Allow creating a NEW versioned statistics series for backfills/corrections. Old series remain and must be deselected manually in Energy.
      default: false
      selector:
        boolean: {}
    retry_pending:
      description: Retry an IDENTICAL pending import only after investigating its missing Recorder rows. Never authorizes changed data.
      default: false
      selector:
        boolean: {}
    confirm:
      description: Explicit confirmation of backup, preview review and recorder write.
      required: true
      selector:
        boolean: {}

verify_history:
  name: Verify imported Recorder statistics (b6)
  description: Read all expected hourly statistics from Recorder and confirm persistence only if every stored bucket and sum matches. Pending imports block new imports.
  fields:
    entry_id:
      description: Optional when only one Trybatec account is configured.
      selector:
        text: {}


preview_costs:
  name: Preview annual historical costs (b7)
  description: Administrator-only, read-only estimates by year, fluid and evidence type. User-entered tariffs and measured versus accounting allocations remain distinct; never an invoice or a Recorder write.
  fields:
    entry_id:
      selector:
        text: {}
    start_date:
      description: Historical interval beginning (YYYY-MM-DD).
      example: "2024-01-01"
      selector:
        text: {}
    end_date:
      description: Historical interval end (YYYY-MM-DD), defaults to today.
      selector:
        text: {}

diagnose_history:
  name: Diagnose historical meter readings (b7)
  description: Administrator-only, read-only unit, interval, conflict and replacement diagnostics without changing source observations.
  fields:
    entry_id:
      selector:
        text: {}
    start_date:
      description: Historical interval beginning (YYYY-MM-DD).
      example: "2024-01-01"
      selector:
        text: {}
    end_date:
      description: Historical interval end (YYYY-MM-DD), defaults to today.
      selector:
        text: {}


preview_b15:
  name: Preview versioned historical series (b15)
  description: Administrator-only read-only audit. Returns exact fingerprint of physical meter raw/smoothed alternatives and one dwelling/fluid series; no Recorder or Energy writes.
  fields:
    entry_id:
      selector:
        text: {}
    start_date:
      example: "2021-01-01"
      selector:
        text: {}
    end_date:
      selector:
        text: {}
    include_cold_water:
      default: true
      selector:
        boolean: {}
    include_hot_water:
      default: true
      selector:
        boolean: {}
    include_heating:
      default: false
      selector:
        boolean: {}

import_b15:
  name: Import verified b15 series into Recorder
  description: Administrator-only. Explicit confirmed backup and preview fingerprint mandatory; queues uniquely versioned physical alternatives and consolidated dwelling/fluid statistics, leaves prior versions intact.
  fields:
    entry_id:
      selector:
        text: {}
    start_date:
      example: "2021-01-01"
      selector:
        text: {}
    end_date:
      selector:
        text: {}
    include_cold_water:
      default: true
      selector:
        boolean: {}
    include_hot_water:
      default: true
      selector:
        boolean: {}
    include_heating:
      default: false
      selector:
        boolean: {}
    plan_fingerprint:
      description: Exact 64-character fingerprint from a fresh preview_b15 action.
      required: true
      selector:
        text: {}
    backup_confirmed:
      description: Confirm that Home Assistant has a recoverable backup.
      required: true
      selector:
        boolean: {}
    confirm:
      description: Explicitly allow import to Recorder; never changes Energy.
      required: true
      selector:
        boolean: {}
    confirm_revision:
      default: false
      selector:
        boolean: {}
    retry_pending:
      default: false
      selector:
        boolean: {}

verify_b15:
  name: Verify persisted b15 Recorder statistics
  description: Administrator-only readback. Compares every queued hourly sum in Recorder before changing the version ledger to verified. Does not alter Energy.
  fields:
    entry_id:
      selector:
        text: {}

preview_b15_energy:
  name: Preview b15 Energy source switch
  description: Administrator-only read-only comparison of one existing Trybatec statistics series with a verified b15 replacement. Rejects double selection and returns preference fingerprint.
  fields:
    entry_id:
      selector:
        text: {}
    old_statistic_id:
      required: true
      selector:
        text: {}
    new_statistic_id:
      required: true
      selector:
        text: {}

activate_b15_energy:
  name: Confirm guarded b15 Energy source switch
  description: Administrator-only. Requires a backup, exact preview fingerprint and explicit confirmation. Saves an audit snapshot, updates and re-reads Energy preferences, and rolls back when a safe rollback can be proven. This is an actual Energy configuration change.
  fields:
    entry_id:
      selector:
        text: {}
    old_statistic_id:
      required: true
      selector:
        text: {}
    new_statistic_id:
      required: true
      selector:
        text: {}
    before_fingerprint:
      description: Exact fingerprint from a fresh preview_b15_energy response.
      required: true
      selector:
        text: {}
    backup_confirmed:
      required: true
      selector:
        boolean: {}
    confirm:
      required: true
      selector:
        boolean: {}
    confirm_rollback:
      description: Required only when explicitly restoring an archived b15 version.
      default: false
      selector:
        boolean: {}


archive_b15_meters:
  name: Archive retired physical meters (b15)
  description: Administrator-only. Save vendor-observed retired meter identities and last observed indexes for read-only historical devices across integration reloads. Requires backup and confirmation. Never changes Recorder or Energy.
  fields:
    entry_id:
      selector:
        text: {}
    start_date:
      example: "2021-01-01"
      selector:
        text: {}
    end_date:
      selector:
        text: {}
    backup_confirmed:
      required: true
      selector:
        boolean: {}
    confirm:
      required: true
      selector:
        boolean: {}

preview_b15_migration:
  name: Preview non-destructive physical entity identity migration (b15)
  description: Administrator-only. Requires proof of the exact lot, fluid, physical serial and verified original source unit; keeps the original Home Assistant entity_id and Recorder intact.
  fields:
    entry_id:
      selector:
        text: {}
    entity_id:
      required: true
      selector:
        text: {}
    lot:
      required: true
      selector:
        text: {}
    fluid:
      required: true
      selector:
        select:
          options:
            - EF
            - ECS
            - CET
    serial:
      required: true
      selector:
        text: {}

apply_b15_migration:
  name: Apply approved non-destructive physical entity identity migration (b15)
  description: Administrator-only. Updates exactly one verified Trybatec entity unique_id while preserving its entity_id, automations, dashboard references and past Recorder statistics. Requires fresh preview fingerprint, backup and confirmation.
  fields:
    entry_id:
      selector:
        text: {}
    entity_id:
      required: true
      selector:
        text: {}
    lot:
      required: true
      selector:
        text: {}
    fluid:
      required: true
      selector:
        select:
          options:
            - EF
            - ECS
            - CET
    serial:
      required: true
      selector:
        text: {}
    before_fingerprint:
      required: true
      selector:
        text: {}
    backup_confirmed:
      required: true
      selector:
        boolean: {}
    confirm:
      required: true
      selector:
        boolean: {}

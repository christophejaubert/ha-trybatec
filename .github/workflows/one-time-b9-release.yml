name: One-time owner-approved Trybatec b9 prerelease

# One owner-authored exact command. No push, PR merge, schedule, or other
# GitHub events can publish a release through this workflow.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  publish-approved-b9:
    name: Publish exactly 0.2.0b9 after verified CI
    if: >-
      github.repository == 'christophejaubert/ha-trybatec' &&
      github.event.issue.number == 6 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'christophejaubert' &&
      github.event.comment.body == 'publish-approved-b9-0eddf999-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: one-time-b9-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: christophejaubert/ha-trybatec
      BASE_SHA: 0eddf999d280601f10666eb9863ba4a85d1dd176
      VERSION: 0.2.0b9
    steps:
      - name: Checkout protected exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify fixed version, scope and all mandatory CI jobs
        shell: bash
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          [[ "$head" == "$GITHUB_SHA" ]] || { echo "main advanced after authorization" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$head" ]] || { echo "Checkout does not match main" >&2; exit 1; }
          gh api "repos/$REPO/compare/$BASE_SHA...$head" > "$RUNNER_TEMP/compare.json"
          gh api "repos/$REPO/actions/runs?head_sha=$head&per_page=100" > "$RUNNER_TEMP/runs.json"
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists; refuse duplicate" >&2
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists; refuse duplicate" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          compare=json.loads((temp/"compare.json").read_text())
          assert compare.get("status")=="ahead" and compare.get("ahead_by")==1, "Unexpected changes since tested b9"
          files=[x["filename"] for x in compare.get("files",[])]
          assert files==[".github/workflows/one-time-b9-release.yml"], "Unexpected code changes since approved b9"
          manifest=json.loads(Path("custom_components/trybatec/manifest.json").read_text())
          assert manifest["domain"]=="trybatec" and manifest["version"]==os.environ["VERSION"]
          notes=Path("RELEASE_NOTES_BETA.md").read_text(encoding="utf-8").split("\n---\n",1)[0]
          assert notes.startswith("# 0.2.0b9") and "Experimental" in notes, "Unexpected b9 release notes"
          (temp/"notes.md").write_text(notes,encoding="utf-8")
          runs=json.loads((temp/"runs.json").read_text())["workflow_runs"]
          good=[r for r in runs if r.get("name")=="Compatibility and tests"
                and r.get("event")=="push" and r.get("head_sha")==os.environ["GITHUB_SHA"]
                and r.get("status")=="completed" and r.get("conclusion")=="success"]
          assert good, "Post-merge successful CI on exact SHA missing"
          (temp/"run_id").write_text(str(good[0]["id"]))
          PY
          run_id="$(cat "$RUNNER_TEMP/run_id")"
          gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$REPO/actions/runs/42515173886" > "$RUNNER_TEMP/b9-original-ci.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          original=json.loads((temp/"b9-original-ci.json").read_text())
          assert original["head_sha"]==os.environ["BASE_SHA"] and original["conclusion"]=="success", "Original b9 CI invalid"
          jobs=json.loads((temp/"jobs.json").read_text())["jobs"]
          required={
            "pure-tests (Python 3.13)","pure-tests (Python 3.14)",
            "ruff-essential","hassfest","hacs","gitleaks",
            "ha-runtime-and-storage","latest-homeassistant-import",
            "resolve-test-refs","decision-persistence (baseline-self)",
            "decision-persistence (candidate-self)",
            "decision-persistence (baseline-to-candidate)",
            "recorder-e2e (baseline)","recorder-e2e (candidate)",
            "decision-persistence-gate",
          }
          done={j["name"] for j in jobs if j.get("status")=="completed" and j.get("conclusion")=="success"}
          assert required.issubset(done), f"Required CI jobs missing or failed: {required-done}"
          PY
      - name: Create and publish exactly one b9 prerelease
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" == "$GITHUB_SHA" ]] || exit 1
          # Publish directly; GitHub's draft-to-release PATCH previously needed
          # special permissions when target_commitish was supplied.
          gh release create "$VERSION" --repo "$REPO" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Trybatec 0.2.0b9 — History menus, unit provenance and diagnostics" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh api "repos/$REPO/releases/tags/$VERSION" > "$RUNNER_TEMP/published.json"
          gh api "repos/$REPO/git/ref/tags/$VERSION" > "$RUNNER_TEMP/tag.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          release=json.loads((temp/"published.json").read_text())
          tag=json.loads((temp/"tag.json").read_text())
          assert release["tag_name"]=="0.2.0b9" and release["draft"] is False
          assert release["prerelease"] is True
          assert release["target_commitish"]==os.environ["GITHUB_SHA"]
          assert tag["object"]["sha"]==os.environ["GITHUB_SHA"], "Tag SHA mismatch"
          print("Verified b9 release:", release["html_url"])
          PY

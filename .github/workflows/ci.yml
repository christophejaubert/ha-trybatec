name: Compatibility and tests

on:
  push:
  pull_request:
  schedule:
    - cron: "21 7 * * *" # Daily detection of latest published HA compatibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pure Python test dependencies
        run: python -m pip install pytest aiohttp
      - name: Compile sources
        run: python -m compileall -q custom_components/trybatec
      - name: Test parsing and API client
        run: python -m pytest -q

  latest-homeassistant-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install latest Home Assistant (not cached/pinned)
        run: python -m pip install --upgrade homeassistant
      - name: Display installed version and import custom component
        run: |
          python -m pip show homeassistant | grep Version
          python -c "import custom_components.trybatec; import custom_components.trybatec.config_flow; import custom_components.trybatec.sensor; import custom_components.trybatec.history_services"

  publish-experimental-beta:
    # Publish only after all tests pass, and only for a direct push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pure-tests, latest-homeassistant-import]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify beta version before publishing
        run: |
          python -c 'import json; assert json.load(open("custom_components/trybatec/manifest.json"))["version"] == "0.2.0b1"'
      - name: Create experimental GitHub pre-release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view '0.2.0b1' > /dev/null 2>&1; then
            echo 'The 0.2.0b1 release already exists; leaving it unchanged.'
          else
            gh release create '0.2.0b1' \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title 'Trybatec 0.2.0b1 — Experimental Beta' \
              --notes-file RELEASE_NOTES_BETA.md
          fi

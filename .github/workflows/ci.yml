name: Compatibility and tests

on:
  push:
  pull_request:
  schedule:
    - cron: "21 7 * * *" # Daily compatibility check with latest published HA
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pure Python test dependencies
        run: python -m pip install pytest aiohttp
      - name: Compile sources
        run: python -m compileall -q custom_components/trybatec
      - name: Test parsing, multi-customer history, service security, and API client
        run: python -m pytest -q
      - name: Validate manifest and public release privacy
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          manifest = json.loads(Path('custom_components/trybatec/manifest.json').read_text())
          assert manifest['version'] == '0.2.0b7' and manifest['domain'] == 'trybatec'
          published = [Path('README.md'), Path('RELEASE_NOTES_BETA.md')]
          published += list(Path('custom_components/trybatec').rglob('*.py'))
          published += list(Path('tests').glob('test_*.py'))
          import re
          private_patterns = (
              re.compile(r'\b[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}\b'),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'\b(?:eyJ[A-Za-z0-9_\-]{24,}\.){2}[A-Za-z0-9_\-]{10,}\b'),
          )
          for file in published:
              contents = file.read_text()
              for pattern in private_patterns:
                  assert not pattern.search(contents), f'Potential secret in {file}'

          PY
      - name: Check brand asset dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from struct import unpack
          for name, n in [('icon.png',256),('icon@2x.png',512)]:
              data=(Path('custom_components/trybatec/brand')/name).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              assert unpack('>II',data[16:24])==(n,n)
          PY

  latest-homeassistant-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install latest Home Assistant (not cached/pinned)
        run: python -m pip install --upgrade homeassistant
      - name: Display installed version and import custom component
        run: |
          python -m pip show homeassistant | grep Version
          python -c "import custom_components.trybatec; import custom_components.trybatec.config_flow; import custom_components.trybatec.sensor; import custom_components.trybatec.history_services"

  publish-experimental-beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TRYBATEC_APPROVE_B7_RELEASE == 'true'
    needs: [pure-tests, latest-homeassistant-import]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify beta version before publishing
        run: |
          python -c 'import json; assert json.load(open("custom_components/trybatec/manifest.json"))["version"] == "0.2.0b7"'
      - name: Create experimental GitHub pre-release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view '0.2.0b7' > /dev/null 2>&1; then
            echo 'The 0.2.0b7 release exists; leaving it unchanged.'
          else
            gh release create '0.2.0b7' \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title 'Trybatec 0.2.0b7 — Historical costs and diagnostics' \
              --notes-file RELEASE_NOTES_BETA.md
          fi

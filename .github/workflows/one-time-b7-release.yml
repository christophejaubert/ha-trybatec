name: One-time explicitly authorized Trybatec b7 prerelease

# The owner explicitly authorized this exact b7 publication in ChatGPT.
# This workflow does not publish on push, PR merge, schedule or normal CI events.
# It only responds to a precise owner-authored command on issue #6, and it
# requires fresh successful CI on the exact default-branch SHA.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  one-time-b7-publication:
    name: Publish exactly 0.2.0b7 once after all gates
    if: >-
      github.repository == 'christophejaubert/ha-trybatec' &&
      github.event.issue.number == 6 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'christophejaubert' &&
      github.event.comment.body == 'publish-approved-b7-fde2d1fb-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: one-time-b7-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: christophejaubert/ha-trybatec
      BASE_SHA: fde2d1fb217d93464731b389200dc07a50120614
      VERSION: 0.2.0b7
      RELEASE_ID: "438384548"
    steps:
      - name: Checkout protected default-branch SHA only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact b7 release scope and successful CI
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          [[ "$head" == "$GITHUB_SHA" ]] || { echo "Main changed after authorization event" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$head" ]] || { echo "Checkout mismatch" >&2; exit 1; }
          gh api "repos/$REPO/compare/$BASE_SHA...$head" > "$RUNNER_TEMP/compare.json"
          gh api "repos/$REPO/actions/runs?head_sha=$head&per_page=100" > "$RUNNER_TEMP/runs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          compare=json.loads((temp/"compare.json").read_text())
          assert compare.get("status")=="ahead" and compare.get("ahead_by")==1, "Unexpected commits since b7 reference"
          changed=[row["filename"] for row in compare.get("files",[])]
          assert changed==[".github/workflows/one-time-b7-release.yml"], f"Unexpected changed files: {changed}"
          manifest=json.loads(Path("custom_components/trybatec/manifest.json").read_text())
          assert manifest["domain"]=="trybatec" and manifest["version"]=="0.2.0b7"
          runs=json.loads((temp/"runs.json").read_text())["workflow_runs"]
          matches=[run for run in runs if run.get("name")=="Compatibility and tests" and run.get("event")=="push"
                   and run.get("status")=="completed" and run.get("conclusion")=="success"
                   and run.get("head_sha")==os.environ["GITHUB_SHA"]]
          assert matches, "Successful push CI missing on exact commit"
          with (temp/"ci_run_id").open("w") as file:
              file.write(str(matches[0]["id"]))
          PY
          run_id="$(cat "$RUNNER_TEMP/ci_run_id")"
          gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          if gh api "repos/$REPO/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to republish" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          jobs=json.loads((temp/"jobs.json").read_text())["jobs"]
          needed={
            "pure-tests (Python 3.13)", "pure-tests (Python 3.14)",
            "ruff-essential", "hassfest", "hacs", "gitleaks",
            "ha-runtime-and-storage", "latest-homeassistant-import",
            "resolve-test-refs", "decision-persistence (baseline-self)",
            "decision-persistence (candidate-self)", "decision-persistence (baseline-to-candidate)",
            "recorder-e2e (baseline)", "recorder-e2e (candidate)", "decision-persistence-gate"
          }
          success={job["name"] for job in jobs if job.get("status")=="completed" and job.get("conclusion")=="success"}
          assert needed.issubset(success), f"Required CI checks missing: {needed-success}"
          release=json.loads((temp/"release.json").read_text())
          assert release["id"]==438384548 and release["draft"] is True
          assert release["tag_name"]=="0.2.0b7" and release["prerelease"] is True
          assert release["target_commitish"]=="9213e66c1ff9a5af970f66c254f4ba35946edc30"
          notes=Path("RELEASE_NOTES_BETA.md").read_text(encoding="utf-8").split("\n---\n",1)[0]
          assert "0.2.0b7" in notes and "production historical import" in notes
          payload={
            "tag_name":"0.2.0b7",
            "target_commitish":os.environ["GITHUB_SHA"],
            "name":"Trybatec 0.2.0b7 — Experimental Beta",
            "body":notes,
            "draft":False,
            "prerelease":True
          }
          (temp/"publish.json").write_text(json.dumps(payload),encoding="utf-8")
          PY
      - name: Publish authorized b7 prerelease at verified SHA
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" --input "$RUNNER_TEMP/publish.json" > "$RUNNER_TEMP/published.json"
          gh api "repos/$REPO/git/ref/tags/$VERSION" > "$RUNNER_TEMP/tag.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          release=json.loads((temp/"published.json").read_text())
          tag=json.loads((temp/"tag.json").read_text())
          assert release["tag_name"]=="0.2.0b7" and release["draft"] is False
          assert release["prerelease"] is True
          assert release["target_commitish"]==os.environ["GITHUB_SHA"]
          assert tag["object"]["sha"]==os.environ["GITHUB_SHA"], "Tag points to wrong commit"
          print("Published b7 prerelease:", release["html_url"])
          print("Commit:", os.environ["GITHUB_SHA"])
          PY

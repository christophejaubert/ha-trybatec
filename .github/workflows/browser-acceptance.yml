name: Synthetic panel browser acceptance

on:
  pull_request:
    paths:
      - "custom_components/trybatec/panel/**"
      - "scripts/browser-ci/**"
      - ".github/workflows/browser-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "custom_components/trybatec/panel/**"
      - "scripts/browser-ci/**"
      - ".github/workflows/browser-acceptance.yml"
  workflow_dispatch:

# No repository write permissions, no secrets, no production HA credentials.
permissions: {}

# FR : annuler seulement les anciennes CI de la même PR ; préserver les autres déclenchements.
# EN: cancel only superseded CI runs for the same PR; preserve all other triggers.
concurrency:
  group: trybatec-browser-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trybatec-browser-synthetic:
    name: Browser FR/EN desktop/mobile (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Official version-matched Playwright image ships Chromium and system
    # dependencies; do not run apt on the hosted runner during browser tests.
    # Digest taken from the successful GitHub runner image pull (run 43053331131).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --user 1001
    steps:
      - name: Journaliser image VM / Log runner image provenance
        shell: bash
        run: |
          printf 'ImageOS=%s ImageVersion=%s RUNNER_OS=%s RUNNER_ARCH=%s\n' \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "${RUNNER_OS:-unknown}" "${RUNNER_ARCH:-unknown}"
          uname -r
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report runner JavaScript runtime
        run: |
          node --version
          npm --version
      # FR : installation uniquement depuis les empreintes verrouillées du lockfile.
      # EN: install exclusively from the lockfile integrity digests.
      - name: Install locked Playwright without lifecycle scripts
        run: npm ci --prefix scripts/browser-ci --ignore-scripts --no-audit --fund=false
      - name: Exercise the real web component in Chromium using synthetic data only
        run: node scripts/browser-ci/acceptance.cjs
      - name: Save synthetic screenshots, including on test failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trybatec-browser-synthetic
          path: browser-acceptance-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7

name: One-time finalize authorized Trybatec b8 draft

# Exactly one owner-authored command on issue #6. No push/merge triggers.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  finalize-b8-draft:
    name: Verify and publish existing 0.2.0b8 draft only
    if: >-
      github.repository == 'christophejaubert/ha-trybatec' &&
      github.event.issue.number == 6 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'christophejaubert' &&
      github.event.comment.body == 'finalize-approved-b8-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: trybatec-b8-one-time-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: christophejaubert/ha-trybatec
      TARGET_SHA: 2c7c8f24a027b609acce1ef76a171aa88f57b39b
      RELEASE_ID: "438422783"
      VERSION: "0.2.0b8"
    steps:
      - name: Checkout protected default branch only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact draft, source and post-merge CI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" == "$GITHUB_SHA" ]] || exit 1
          gh api "repos/$REPO/compare/$TARGET_SHA...$GITHUB_SHA" > "$RUNNER_TEMP/diff.json"
          gh api "repos/$REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/draft.json"
          gh api "repos/$REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
          if gh api "repos/$REPO/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to republish" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          diff=json.loads((temp/"diff.json").read_text())
          assert diff.get("status")=="ahead" and diff.get("ahead_by")==1, "Main changed beyond one controlled workflow fix"
          assert [f["filename"] for f in diff.get("files",[])]==[".github/workflows/one-time-b8-release.yml"], "Unexpected changes since b8 candidate"
          manifest=json.loads(Path("custom_components/trybatec/manifest.json").read_text())
          assert manifest["domain"]=="trybatec" and manifest["version"]==os.environ["VERSION"]
          draft=json.loads((temp/"draft.json").read_text())
          assert draft["id"]==438422783 and draft["tag_name"]==os.environ["VERSION"]
          assert draft["draft"] is True and draft["prerelease"] is True
          assert draft["target_commitish"]==os.environ["TARGET_SHA"]
          assert draft["body"].startswith("# 0.2.0b8") and "does not authorize historical Recorder imports" in draft["body"]
          runs=json.loads((temp/"runs.json").read_text())["workflow_runs"]
          good=[r for r in runs if r.get("name")=="Compatibility and tests"
                and r.get("event")=="push" and r.get("head_sha")==os.environ["GITHUB_SHA"]
                and r.get("status")=="completed" and r.get("conclusion")=="success"]
          assert good, "Successful post-merge CI on the current workflow-fix commit is required"
          (temp/"ci_run_id").write_text(str(good[0]["id"]))
          (temp/"publish.json").write_text(json.dumps({
            "draft":False,"prerelease":True,
            "target_commitish":os.environ["TARGET_SHA"]
          }),encoding="utf-8")
          PY
          # Verify both the original tested integration SHA and updated workflow SHA.
          gh api "repos/$REPO/actions/runs/42507958953" > "$RUNNER_TEMP/original-run.json"
          run_id="$(cat "$RUNNER_TEMP/ci_run_id")"
          gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          original=json.loads((root/"original-run.json").read_text())
          assert original["head_sha"]==os.environ["TARGET_SHA"]
          assert original["event"]=="push" and original["status"]=="completed" and original["conclusion"]=="success"
          jobs=json.loads((root/"jobs.json").read_text())["jobs"]
          required={
            "pure-tests (Python 3.13)", "pure-tests (Python 3.14)",
            "ruff-essential", "hassfest", "hacs", "gitleaks",
            "ha-runtime-and-storage", "latest-homeassistant-import",
            "resolve-test-refs", "decision-persistence (baseline-self)",
            "decision-persistence (candidate-self)", "decision-persistence (baseline-to-candidate)",
            "recorder-e2e (baseline)", "recorder-e2e (candidate)",
            "decision-persistence-gate",
          }
          succeeded={j["name"] for j in jobs if j.get("status")=="completed" and j.get("conclusion")=="success"}
          assert required.issubset(succeeded), f"Missing CI controls: {required-succeeded}"
          PY
      - name: Publish only verified draft by immutable release ID
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" == "$GITHUB_SHA" ]] || exit 1
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/publish.json" > "$RUNNER_TEMP/published.json"
          gh api "repos/$REPO/git/ref/tags/$VERSION" > "$RUNNER_TEMP/tag.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          release=json.loads((root/"published.json").read_text())
          tag=json.loads((root/"tag.json").read_text())
          assert release["id"]==438422783 and release["tag_name"]=="0.2.0b8"
          assert release["draft"] is False and release["prerelease"] is True
          assert release["target_commitish"]==os.environ["TARGET_SHA"]
          assert tag["object"]["sha"]==os.environ["TARGET_SHA"]
          print("Published b8:",release["html_url"])
          PY
